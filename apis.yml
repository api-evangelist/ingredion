description: >-
  Ingredion Incorporated is a Fortune 500 global ingredient solutions provider headquartered in
  Westchester, Illinois, that turns grains, fruits, vegetables and other plant materials into
  starches, sweeteners, plant-based proteins, texturizers, and clean-label and sugar-reduction
  systems for food, beverage, brewing, animal nutrition, pharmaceutical and industrial
  manufacturers across more than 120 countries. Ingredion publishes no developer program and no
  machine-readable API contract; its customer-facing ordering, document and support surface is
  the login-only MyIngredion portal, which runs on Salesforce Experience Cloud under Ingredion's
  own domain and is the only host serving an anonymously readable discovery document.
